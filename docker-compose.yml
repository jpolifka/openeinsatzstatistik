name: pdf2einsatz

services:
  einsatzberichte:
    build:
      context: .
      target: app
    image: pdf2einsatz-web
    container_name: einsatzberichte
    ports:
      - "${APP_PORT:?APP_PORT fehlt in .env (Vorlage: .env.example)}:8112"
    # Alle Einstellungen kommen aus .env (Vorlage: .env.example), hier stehen keine Standardwerte
    env_file: .env
    environment:
      # Datenordner im Container, gehört zum Volume unten
      DATA_DIR: /daten
    volumes:
      - ./daten:/daten
    restart: unless-stopped
    networks:
      - pdf2einsatz

networks:
  pdf2einsatz:
      - name: pdf2einsatz