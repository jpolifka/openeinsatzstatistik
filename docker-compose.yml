# Projektname und Netzwerk heißen aus Kompatibilität mit bestehenden Installationen weiter „openEinsatzstatistik“
name: openEinsatzstatistik

services:
  einsatzberichte:
    build:
      context: .
      target: app
    image: openeinsatzstatistik-web
    container_name: einsatzberichte
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:?APP_PORT fehlt in .env (Vorlage: .env.example)}:8112"
    # Alle Einstellungen kommen aus .env (Vorlage: .env.example), hier stehen keine Standardwerte
    env_file: .env
    environment:
      # Datenordner im Container, gehört zum Volume unten
      DATA_DIR: /daten
      # Die Anwendung prüft damit, ob AUTH_DISABLED=1 nur lokal gebunden läuft (sonst Startabbruch)
      APP_BIND: ${APP_BIND:-127.0.0.1}
    volumes:
      - ./daten:/daten
    restart: unless-stopped
    # Die App läuft als Besitzer von ./daten (oder APP_UID/APP_GID aus .env), nie als root.
    # Der Einstieg braucht dafür nur den Wechsel der Benutzerkennung.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    # Dateisystem des Containers nur lesbar; geschrieben wird in ./daten und /tmp
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openEinsatzstatistik

networks:
  openEinsatzstatistik:
      name: openEinsatzstatistik
