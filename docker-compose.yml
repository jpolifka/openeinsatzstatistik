name: pdf2einsatz

services:
  einsatzberichte:
    build:
      context: .
      target: app
    image: pdf2einsatz-web
    container_name: einsatzberichte
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:?APP_PORT fehlt in .env (Vorlage: .env.example)}:8112"
    # Alle Einstellungen kommen aus .env (Vorlage: .env.example), hier stehen keine Standardwerte
    env_file: .env
    environment:
      # Datenordner im Container, gehört zum Volume unten
      DATA_DIR: /daten
    volumes:
      - ./daten:/daten
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - pdf2einsatz

networks:
  pdf2einsatz:
      name: pdf2einsatz
