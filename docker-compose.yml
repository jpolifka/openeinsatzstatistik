name: pdf2einsatz

services:
  einsatzberichte:
    build:
      context: .
      target: app
    image: pdf2einsatz-web
    container_name: einsatzberichte
    ports:
      - "${APP_PORT:?APP_PORT fehlt in .env (Vorlage: .env.example)}:8112"
    # Alle Einstellungen kommen aus .env (Vorlage: .env.example), hier stehen keine Standardwerte
    env_file: .env
    environment:
      # Pfade im Container, gehören zu den Volumes unten
      DB_PATH: /daten/einsaetze.db
      IMPORT_DIR: /import
    volumes:
      - ./daten:/daten
      # Nur für den Erstimport: vorhandene Einsatzübersicht_JJJJ.xlsx
      - ./Einsatzberichte:/import:ro
    restart: unless-stopped
