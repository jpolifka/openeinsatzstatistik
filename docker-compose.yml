name: pdf2einsatz

services:
  einsatzberichte:
    build:
      context: .
      target: app
    image: pdf2einsatz-web
    container_name: einsatzberichte
    ports:
      - "${APP_PORT:?APP_PORT fehlt in .env (Vorlage: .env.example)}:8112"
    # Alle Einstellungen kommen aus .env (Vorlage: .env.example), hier stehen keine Standardwerte
    env_file: .env
    environment:
      # Pfad im Container, gehört zum Volume unten
      DB_PATH: /daten/einsaetze.db
    volumes:
      - ./daten:/daten
    restart: unless-stopped
