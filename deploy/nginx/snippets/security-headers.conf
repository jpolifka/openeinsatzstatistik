# Dieselben Header setzt die App selbst (app/main.py, SECURITY_HEADERS); hier zusätzlich, damit auch Fehlerseiten des
# Proxys sie tragen. Gilt für alle Antworten außer dem AVV-Dokument.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Keine Inline-Skripte in der Oberfläche; Inline-Styles werden genutzt (Wehr-Farben, style-Attribute).
# Cloudflares eingeschobenes Bot-Skript wird dadurch blockiert (unkritisch; „JavaScript Detections“ ggf. abschalten).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
