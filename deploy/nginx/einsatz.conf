# nginx vor openEinsatzstatistik (Cloudflare → nginx → 127.0.0.1:8112)
# Ablage z. B. /etc/nginx/conf.d/einsatz.conf, dazu snippets/ nach /etc/nginx/snippets/ kopieren.
# Voraussetzung: Cloudflare-SSL-Modus „Full (strict)“ mit Origin-Zertifikat (sonst Weiterleitungsschleife).
# Die Cloudflare-Adressen in snippets/cloudflare-realip.conf regelmäßig aktualisieren (https://www.cloudflare.com/ips/).

# ---- Access-Log ohne Query-String: der Anmeldelink (/auth/verify?token=…) gehört nicht ins Log ----
log_format einsatz '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# ---- Rate-Limits (Schlüssel = echte Client-Adresse, siehe realip) ----
limit_req_zone  $binary_remote_addr zone=login:10m   rate=5r/m;     # Anmeldelink anfordern / einlösen
limit_req_zone  $binary_remote_addr zone=upload:10m  rate=30r/m;    # Berichte einlesen
limit_req_zone  $binary_remote_addr zone=api:10m     rate=300r/m;   # übrige Anfragen
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream einsatz {
    server 127.0.0.1:8112;
    keepalive 16;
}

# ---- HTTP: nur Weiterleitung auf HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name einsatz.cheezuscraizt.de;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name einsatz.cheezuscraizt.de;

    ssl_certificate     /etc/ssl/cloudflare/einsatz.pem;       # Cloudflare-Origin-Zertifikat
    ssl_certificate_key /etc/ssl/cloudflare/einsatz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    include snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/einsatz.access.log einsatz;
    server_tokens off;
    # Wie RequestSizeLimit in app/request_limits.py: JSON klein, nur die Upload-Wege größer (unten je location)
    client_max_body_size 2m;
    client_body_timeout  60s;
    client_header_timeout 15s;
    keepalive_timeout    30s;
    limit_conn perip 40;

    # Unbekannte Host-Header ablehnen (nur über den Servernamen erreichbar)
    if ($host != "einsatz.cheezuscraizt.de") { return 444; }

    include snippets/security-headers.conf;

    # Anmeldung: streng begrenzt
    location ~ ^/(login|auth/verify)$ {
        proxy_read_timeout 30s;
        limit_req zone=login burst=5 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy.conf;
    }

    # Berichte einlesen (große Uploads, lange Antwortzeit)
    location = /api/reports {
        client_max_body_size 105m;
        limit_req zone=upload burst=10 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy.conf;
        proxy_request_buffering off;
        proxy_read_timeout 95s;         # Cloudflare bricht bei ca. 100 s ab
    }

    # AVV-Dokument bringt eigene CSP mit (Druckansicht mit Skript): keine zweite, strengere setzen
    location ~ ^/api/dpa/[^/]+/document$ {
        proxy_read_timeout 30s;
        limit_req zone=api burst=30 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include snippets/proxy.conf;
    }

    # AVV-PDF (10 MB) und Stichwortkatalog (2 MB)
    location ~ ^/api/dpa/[^/]+/upload$ {
        client_max_body_size 11m;
        proxy_read_timeout 30s;
        limit_req zone=api burst=10 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy.conf;
    }
    location ~ ^/api/admin/(vgs/[^/]+|[^/]+)/keywords/import$ {
        client_max_body_size 3m;
        proxy_read_timeout 60s;
        limit_req zone=api burst=10 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy.conf;
    }

    location / {
        proxy_read_timeout 60s;
        limit_req zone=api burst=60 nodelay;
        include snippets/security-headers.conf;
        include snippets/proxy.conf;
    }
}
