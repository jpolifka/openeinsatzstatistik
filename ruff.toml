# Linter (CI: .github/workflows/checks.yml). Bewusst schlank: Fehler, ungenutzter Code, typische Bugs.
line-length = 120
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",   # Depends(...) als Vorgabewert gehört zu FastAPI
    "B904",   # raise ... from: HTTPException(…) im except ist hier gewollt
    "B905",   # zip ohne strict
    "E731", "E741",
]

[lint.per-file-ignores]
"tests/*" = ["F811"]    # Fixtures aus conftest werden als Parameter „neu definiert“
