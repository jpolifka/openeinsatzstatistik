# Dependabot legt Pull Requests für Updates an. Sicherheitsupdates für bekannte Schwachstellen kommen unabhängig
# vom Zeitplan sofort; der Zeitplan gilt für reguläre Versionsupdates.
version: 2
updates:
  # Python-Pakete: Dependabot ändert nur requirements.txt. Danach das Lock neu erzeugen:
  # pip-compile --generate-hashes --output-file=requirements.lock --strip-extras requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns: ["*"]
  # Basis-Image des Dockerfiles (python:3.14-slim)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Aktionen in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
