name: Wöchentliche Sicherheitsprüfung

# Neue Schwachstellen in den gesperrten Paketen erscheinen auch ohne Änderung am Code
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.lock
