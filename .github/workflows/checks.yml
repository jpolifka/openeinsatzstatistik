name: Tests und Sicherheitsprüfung

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14']      # wie das Docker-Image; 3.15 folgt, sobald alle Pakete Wheels dafür haben (httptools, pydantic-core)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Der Lock ist maßgeblich: stimmt er nicht mit requirements.txt überein, schlägt die Prüfung fehl
      - run: python -m pip install pip-tools==7.7.0
      - run: python -m piptools compile --quiet --generate-hashes --output-file=/tmp/requirements.lock --strip-extras requirements.txt
      - run: diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)
        shell: bash
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes -r requirements.lock
      # Getestet wird das Image, das auch ausgeliefert wird (nur der Lock, keine zweite Paketauflösung)
      - run: docker build --target test -t openeinsatzstatistik-test .
      - run: docker run --rm openeinsatzstatistik-test
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: for file in static/*.js; do node --check "$file"; done
      - run: node --test tests/frontend/*.test.cjs
