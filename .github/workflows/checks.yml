name: Tests und Sicherheitsprüfung

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14']      # wie das Docker-Image; 3.15 folgt, sobald alle Pakete Wheels dafür haben (httptools, pydantic-core)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Der Lock ist maßgeblich: jede feste Version aus requirements.txt muss darin genauso stehen
      - run: python tools/check_lock.py
      - run: python -m pip install ruff==0.17.6
      - run: python -m ruff check app tools tests
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes -r requirements.lock
      # Getestet wird das Image, das auch ausgeliefert wird (nur der Lock, keine zweite Paketauflösung)
      - run: docker build --target test -t openeinsatzstatistik-test .
      - run: docker run --rm -e COVERAGE_CORE=ctrace openeinsatzstatistik-test python -m pytest -q -x --cov=app --cov-branch --cov-fail-under=95
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: for file in static/*.js; do node --check "$file"; done
      - run: node --test tests/frontend/*.test.cjs
